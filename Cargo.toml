[package]
name = "intear-dex-aggregator-tool-box"
version = "0.1.0"
edition = "2024"

# =================================================
# =================================================

# [lib]
# path = "src/lib.rs"

# [[bin]]
# name = "dex_aggregator_swap_bin"
# path = "src/bin/dex_aggregator_swap_bin.rs"

# =================================================
# =================================================

[dependencies]
# Pinned to 0.15.0 to stay type-compatible with near-kit-tool-box-rs
# (its NEAR_KIT_CLIENT returns near_kit::Near from this version).
near-kit = "0.15.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.13", features = ["json", "query"] }
base64 = "0.22"
thiserror = "2.0"

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }

